name: Validate with coverage

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate-with-coverage:
    name: validate-with-coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # for Codecov OIDC upload
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: iwamot/actions/mise-validate@ec014ff64ffe0bbb47e97ae8e8358fdae2a510eb # v2.13.0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
