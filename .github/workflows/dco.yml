name: DCO

on:
  workflow_call:
  pull_request:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read  # to read PR commits for DCO sign-off check
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: KineticCafe/actions-dco@e4595310c8e9871bea33cdf1c9ef9b2cdb9cb3d6 # v4.0.1
