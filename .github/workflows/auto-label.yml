name: 'Auto label by title'

on:
  workflow_call:
  pull_request:
    types: [opened, edited]
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write  # to add a label to the PR
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Apply release-note label from Conventional Commits prefix
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # The title is the only input: derive the labels it implies, then make
          # the PR match. Re-running on an edited title therefore replaces a
          # stale label instead of piling a second one on top.
          desired=""

          # Breaking-change marker ('!' before ':')
          if echo "$TITLE" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:'; then
            desired="breaking"
          fi

          # Parse Conventional Commits prefix and scope
          prefix=$(echo "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]+\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')
          scope=$(echo "$TITLE" | sed -nE 's/^[a-zA-Z]+\(([^)]+)\)!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')

          # scope=deps takes precedence over the type mapping (handles Renovate's
          # `chore(deps):` and `fix(deps):` uniformly).
          if [ "$scope" = "deps" ]; then
            label=dependencies
          else
            case "$prefix" in
              feat)       label=feature ;;
              fix)        label=bugfix ;;
              chore|docs) label=maintenance ;;
              article)    label=article ;;
              *)          label="" ;;
            esac
          fi
          if [ -n "$label" ]; then
            desired="$desired $label"
          fi

          # Labels this workflow owns and may remove. `dependencies` is added but
          # never removed: Renovate sets it too, via :label(dependencies).
          managed="feature bugfix maintenance article breaking"

          current=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          has() { echo "$current" | grep -qxF "$1"; }

          args=()
          for l in $desired; do
            if ! has "$l"; then
              args+=(--add-label "$l")
            fi
          done
          for l in $managed; do
            case " $desired " in
              *" $l "*) continue ;;
            esac
            if has "$l"; then
              args+=(--remove-label "$l")
            fi
          done

          if [ ${#args[@]} -eq 0 ]; then
            echo "Labels already match the title: ${desired:-(none)}"
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" "${args[@]}"
          echo "Applied:${args[*]}"
