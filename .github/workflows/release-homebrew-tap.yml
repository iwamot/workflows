name: Release with Homebrew tap update

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create for a manual release from the default branch'
        type: string
        default: ''
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
      cask_name:
        description: 'Cask file name without .rb. The matching .rb file is located under dist/ (typically dist/homebrew/Casks/<cask_name>.rb as GoReleaser writes by default) and uploaded to Casks/<cask_name>.rb in the tap. Also used as part of the PR title / branch name. Defaults to the caller repository name.'
        type: string
        default: ${{ github.event.repository.name }}
      environment:
        description: 'GitHub Actions environment to run in'
        type: string
        default: production
    secrets:
      homebrew_tap_app_client_id:
        description: 'GitHub App client ID for the iwamot/homebrew-tap repo'
        required: true
      homebrew_tap_app_private_key:
        description: 'GitHub App private key for the iwamot/homebrew-tap repo'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: write  # to create the draft Release, upload binary archives, and publish the Release
      checks: read  # to wait for required CI before tagging
      statuses: read  # to inspect required legacy commit statuses
      id-token: write  # to mint OIDC token for attestation
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            proxy.golang.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-tag@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - uses: iwamot/actions/release-draft@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}

      - uses: iwamot/actions/go-publish@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}

      - uses: iwamot/actions/homebrew-tap-pr@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
          cask_name: ${{ inputs.cask_name }}
          app_client_id: ${{ secrets.homebrew_tap_app_client_id }}
          app_private_key: ${{ secrets.homebrew_tap_app_private_key }}

      - uses: iwamot/actions/release-publish@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
