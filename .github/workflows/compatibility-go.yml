name: Compatibility (Go)

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions to test against (e.g. ''["1.25","1.26"]''). Must list every minor from the `go` directive in `go.mod` through the `go` pin in `mise.toml`.'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-check:
    name: matrix-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          DECLARED: ${{ inputs.go-versions }}
        run: |
          set -euo pipefail

          floor=$(grep -m1 -oE '^go[[:space:]]+1\.[0-9]+' go.mod | grep -oE '1\.[0-9]+$' || true)
          if [ -z "$floor" ]; then
            echo "go.mod must declare a go directive."
            exit 1
          fi

          pin=$(grep -m1 -oE '^go[[:space:]]*=[[:space:]]*"1\.[0-9]+' mise.toml | grep -oE '1\.[0-9]+$' || true)
          if [ -z "$pin" ]; then
            echo "mise.toml must pin go under [tools]."
            exit 1
          fi

          expected=$(seq "${floor#1.}" "${pin#1.}" | sed 's/^/1./' | jq -Rsc 'split("\n")[:-1]')
          actual=$(jq -c . <<<"$DECLARED")

          if [ "$expected" != "$actual" ]; then
            echo "go-versions must list every minor from the go directive ($floor) through the mise pin ($pin)."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi

  per-go:
    name: per-go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(inputs.go-versions) }}
    permissions:
      contents: read
    env:
      MISE_GO_VERSION: ${{ matrix.go }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: bash compatibility.sh

  compatibility-go:
    name: compatibility-go
    needs:
      - matrix-check
      - per-go
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - env:
          CHECK: ${{ needs.matrix-check.result }}
          RESULT: ${{ needs.per-go.result }}
        run: '[ "$CHECK" = "success" ] && [ "$RESULT" = "success" ]'
