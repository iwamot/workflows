name: Oide

on:
  workflow_call:
    inputs:
      SOURCES:
        type: string
        required: false
        default: ''
        description: 'What to pull from where: one source per line, as `org/repo@ref` optionally followed by the Oidefile to read for it. Give each source its own Oidefile so no two claim the same path. A `#` line is ignored, which is where a `# renovate: datasource=...` annotation goes — it has to sit directly above the pin it belongs to.'
      TEMPLATE_VERSION:
        type: string
        required: false
        default: ''
        description: 'Deprecated, and ignored when SOURCES is given: the source ref of iwamot/repo-template, on its own. Kept until every caller has moved to SOURCES.'
    secrets:
      OIDE_APP_CLIENT_ID:
        required: true
        description: 'iwamot-oide GitHub App Client ID'
      OIDE_APP_PRIVATE_KEY:
        required: true
        description: 'iwamot-oide GitHub App private key (PEM)'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oide.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-tags depName=iwamot/repo-template
  TEMPLATE_VERSION: v1.10.0

jobs:
  pull:
    name: pull
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production  # so env-scoped OIDE_APP_* secrets are accessible on self-run
    permissions:
      contents: read  # write operations go through the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve sources
        # workflow_call passes the caller-supplied inputs. The push trigger (workflows
        # self-run) doesn't go through workflow_call, so 'inputs' is empty and we fall
        # back to the workflows-internal env pin.
        env:
          INPUT_SOURCES: ${{ inputs.SOURCES }}
          INPUT_TEMPLATE_VERSION: ${{ inputs.TEMPLATE_VERSION }}
        run: |
          set -euo pipefail

          sources="${INPUT_SOURCES}"
          if [ -z "${sources}" ]; then
            sources="iwamot/repo-template@${INPUT_TEMPLATE_VERSION:-${TEMPLATE_VERSION}}"
          fi

          {
            echo "SOURCES<<OIDE_EOF"
            echo "${sources}"
            echo "OIDE_EOF"
            echo "BODY<<OIDE_EOF"
            echo "Pulled via [oide](https://github.com/iwamot/oide) from:"
            echo ""
            while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              case "${line}" in "" | \#*) continue ;; esac
              target="${line%%[[:space:]]*}"
              repo="${target%@*}"
              ref="${target##*@}"
              echo "- [${repo}@${ref}](https://github.com/${repo}/tree/${ref})"
            done <<< "${sources}"
            echo "OIDE_EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.OIDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OIDE_APP_PRIVATE_KEY }}
          permission-contents: write       # to push the branch
          permission-pull-requests: write  # to open the PR
          permission-issues: write         # to create the maintenance label

      - uses: iwamot/oide@c08d08a83ef7849801e52c9c58db23418311816a # v2.1.0
        with:
          sources: ${{ env.SOURCES }}

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: oide/pull
          TITLE: 'chore: pull files via oide'
          LABEL: maintenance
        run: |
          set -euo pipefail

          # Use the App's bot identity as the commit author. /user is not
          # accessible with installation tokens, but /users/<login> is a
          # public endpoint and works.
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq '.id')
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          # Ensure the label exists (idempotent — same convention Renovate uses
          # for its `dependencies` label).
          gh label create "$LABEL" \
            --color 6a737d \
            --description "Maintenance updates" \
            2>/dev/null || true

          git add -A
          if git diff --cached --quiet; then
            echo "No changes; nothing to PR"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"

          auth=$(printf '%s' "x-access-token:${GH_TOKEN}" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${auth}" push -f origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "$LABEL"
          else
            echo "PR already open for $BRANCH; updated by force-push"
            gh pr edit "$BRANCH" --add-label "$LABEL" 2>/dev/null || true
          fi

          # Enable auto-merge so the PR merges as soon as required checks
          # pass. Idempotent: re-enabling on an already-auto-merge-enabled
          # PR is a no-op.
          gh pr merge "$BRANCH" --auto --squash
