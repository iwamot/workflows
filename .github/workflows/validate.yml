name: Validate

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [ "main" ]
  # Daily, so a new advisory against the locked dependencies fails the audit
  # even when nothing else changes.
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: iwamot/actions/mise-validate@0cc8920c2941f4e51302920bc6f705f3ad2c0608 # v2.13.2
