name: Validate

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [ "main" ]
  # Daily, so a new advisory against the locked dependencies fails the audit
  # even when nothing else changes.
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: iwamot/actions/mise-validate@ac787438f61b5cbe16cf7b9946d16e6f0af4ff31 # v2.12.0
