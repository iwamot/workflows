name: Validate

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [ "main" ]
  # Daily, so a new advisory against the locked dependencies fails the audit
  # even when nothing else changes.
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: iwamot/actions/mise-validate@0d914fa9784b202add6a0ddf9014413962731e99 # v2.17.0
