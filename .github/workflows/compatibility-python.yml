name: Compatibility (Python)

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test against (e.g. ''["3.11","3.12","3.13","3.14"]''). Must list every minor from the lower bound of `requires-python` in `pyproject.toml` through the `python` pin in `mise.toml`.'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  matrix-check:
    name: matrix-check
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          DECLARED: ${{ inputs.python-versions }}
        run: |
          set -euo pipefail

          floor=$(grep -m1 -oE 'requires-python[[:space:]]*=[[:space:]]*">=3\.[0-9]+' pyproject.toml | grep -oE '3\.[0-9]+$' || true)
          if [ -z "$floor" ]; then
            echo "pyproject.toml must declare requires-python with a >= lower bound."
            exit 1
          fi

          pin=$(grep -m1 -oE '^python[[:space:]]*=[[:space:]]*"3\.[0-9]+' mise.toml | grep -oE '3\.[0-9]+$' || true)
          if [ -z "$pin" ]; then
            echo "mise.toml must pin python under [tools]."
            exit 1
          fi

          expected=$(seq "${floor#3.}" "${pin#3.}" | sed 's/^/3./' | jq -Rsc 'split("\n")[:-1]')
          actual=$(jq -c . <<<"$DECLARED")

          if [ "$expected" != "$actual" ]; then
            echo "python-versions must list every minor from requires-python (>=$floor) through the mise pin ($pin)."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi

  per-python:
    name: per-python
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get mise version from mise.toml
        id: mise-version
        # Assign first so a failure reading min_version fails the step instead
        # of writing an empty version, which mise-action treats as "latest".
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install: false
      - run: bash compatibility.sh

  compatibility-python:
    name: compatibility-python
    needs:
      - matrix-check
      - per-python
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - env:
          CHECK: ${{ needs.matrix-check.result }}
          RESULT: ${{ needs.per-python.result }}
        run: '[ "$CHECK" = "success" ] && [ "$RESULT" = "success" ]'
