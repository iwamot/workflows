name: Release with ECR Public publish

on:
  workflow_call:
    inputs:
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
      registry_image:
        description: 'Full ECR Public image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo)'
        type: string
        required: true
      environment:
        description: 'GitHub Actions environment to run in'
        type: string
        default: production
    secrets:
      aws_role_arn:
        description: 'IAM role ARN to assume via OIDC'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ${{ inputs.registry_image }}
  AWS_REGION: us-east-1

jobs:
  release-draft:
    name: release-draft
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write  # to create the draft GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-draft@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1

  publish-ecr-public:
    needs: release-draft
    name: publish-ecr-public
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write  # to mint OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: iwamot/actions/docker-build-digest@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
        with:
          registry_image: ${{ env.REGISTRY_IMAGE }}
          platform: ${{ matrix.platform }}

  merge-and-sign:
    needs: publish-ecr-public
    name: merge-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write  # to mint OIDC tokens for AWS role assumption, cosign, and attest
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: iwamot/actions/docker-merge-and-sign@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
        with:
          registry_image: ${{ env.REGISTRY_IMAGE }}

  release-publish:
    needs: merge-and-sign
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write  # to flip the draft GitHub Release to published
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-publish@877dcb21b865c1824a70cfebde66313b1d58a860 # v2.8.1
