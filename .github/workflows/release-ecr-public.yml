name: Release with ECR Public publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create for a manual release from the default branch'
        type: string
        default: ''
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
      registry_image:
        description: 'Full ECR Public image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo)'
        type: string
        required: true
      environment:
        description: 'GitHub Actions environment to run in'
        type: string
        default: production
    secrets:
      aws_role_arn:
        description: 'IAM role ARN to assume via OIDC'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ${{ inputs.registry_image }}
  AWS_REGION: us-east-1

jobs:
  release-draft:
    name: release-draft
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: write  # to create the draft GitHub Release
      checks: read  # to wait for required CI before tagging
      statuses: read  # to inspect required legacy commit statuses
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-tag@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - uses: iwamot/actions/release-draft@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        with:
          tag: ${{ steps.release-tag.outputs.tag }}

  publish-ecr-public:
    needs: release-draft
    name: publish-ecr-public
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write  # to mint OIDC token for AWS role assumption
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: iwamot/actions/docker-build-digest@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        with:
          tag: ${{ needs.release-draft.outputs.tag }}
          registry_image: ${{ env.REGISTRY_IMAGE }}
          platform: ${{ matrix.platform }}

  merge-and-sign:
    needs: [release-draft, publish-ecr-public]
    name: merge-and-sign
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write  # to mint OIDC tokens for AWS role assumption, cosign, and attest
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: iwamot/actions/docker-merge-and-sign@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        with:
          tag: ${{ needs.release-draft.outputs.tag }}
          registry_image: ${{ env.REGISTRY_IMAGE }}

  release-publish:
    needs: [release-draft, merge-and-sign]
    name: release-publish
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: write  # to flip the draft GitHub Release to published
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.ecr-public.us-east-1.amazonaws.com:443
            api.github.com:443
            auth.docker.io:443
            d2glxqk2uabbnd.cloudfront.net:443
            d5l0dvt14r5h8.cloudfront.net:443
            deb.debian.org:443
            fulcio.sigstore.dev:443
            github.com:443
            production.cloudfront.docker.com:443
            public.ecr.aws:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            sts.us-east-1.amazonaws.com:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-publish@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        with:
          tag: ${{ needs.release-draft.outputs.tag }}
