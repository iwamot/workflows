name: Release

on:
  workflow_call:
    inputs:
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write  # to create the GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ${{ inputs.allowed_endpoints }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "${TAG}" --generate-notes
