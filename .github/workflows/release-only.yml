name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create when manually releasing from the default branch'
        type: string
        default: ''
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v8.16.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: write  # to create the GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ${{ inputs.allowed_endpoints }}

      - name: Resolve release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${SOURCE_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "Run manual releases from ${DEFAULT_BRANCH}." >&2
              exit 1
            fi
            TAG="${INPUT_TAG}"
            if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Enter a release tag such as v1.2.3." >&2
              exit 1
            fi
            if TAG_SHA=$(gh api "repos/${GH_REPO}/commits/refs%2Ftags%2F${TAG}" --jq .sha 2>/dev/null); then
              if [[ "${TAG_SHA}" != "${SOURCE_SHA}" ]]; then
                echo "Tag ${TAG} points to another commit; refusing to move it." >&2
                exit 1
              fi
            else
              gh api --method POST "repos/${GH_REPO}/git/refs" \
                -f "ref=refs/tags/${TAG}" -f "sha=${SOURCE_SHA}"
            fi
          elif [[ "${EVENT_NAME}" == "push" && "${SOURCE_REF}" == refs/tags/* ]]; then
            TAG="${SOURCE_REF#refs/tags/}"
          else
            echo "Release requires a tag push or a manual run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: gh release create "${TAG}" --verify-tag --generate-notes
