name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create when manually releasing from the default branch'
        type: string
        default: ''
      allowed_endpoints:
        description: 'Endpoints the jobs may reach on top of the ones the release needs, whitespace separated (domain:port)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v8.16.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: write  # to create the GitHub Release
      checks: read  # to wait for required CI before creating a tag
      statuses: read  # to inspect required legacy commit statuses
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ${{ inputs.allowed_endpoints }}

      - uses: iwamot/actions/release-tag@e9e74be15f07a22d117c3fe0f8f225653de549dc # v2.13.1
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: gh release create "${TAG}" --verify-tag --generate-notes
