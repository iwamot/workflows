name: Compatibility (Node)

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js versions to test against (e.g. ''["20","22","24"]''). Must list every even major from the lower bound of `engines.node` in `package.json` through the `node` pin in `mise.toml`.'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-check:
    name: matrix-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          DECLARED: ${{ inputs.node-versions }}
        run: |
          set -euo pipefail

          floor=$(jq -r '.engines.node // ""' package.json | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "$floor" ]; then
            echo "package.json must declare engines.node."
            exit 1
          fi

          pin=$(grep -m1 -oE '^node[[:space:]]*=[[:space:]]*"[0-9]+' mise.toml | grep -oE '[0-9]+$' || true)
          if [ -z "$pin" ]; then
            echo "mise.toml must pin node under [tools]."
            exit 1
          fi

          expected=$(seq "$floor" 2 "$pin" | jq -Rsc 'split("\n")[:-1]')
          actual=$(jq -c . <<<"$DECLARED")

          if [ "$expected" != "$actual" ]; then
            echo "node-versions must list every even major from engines.node (>=$floor) through the mise pin ($pin)."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi

  per-node:
    name: per-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    permissions:
      contents: read
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
      - run: bash compatibility.sh

  compatibility-node:
    name: compatibility-node
    needs:
      - matrix-check
      - per-node
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - env:
          CHECK: ${{ needs.matrix-check.result }}
          RESULT: ${{ needs.per-node.result }}
        run: '[ "$CHECK" = "success" ] && [ "$RESULT" = "success" ]'
