name: Renovate

on:
  workflow_call:
    inputs:
      log-level:
        description: 'Log level'
        type: string
        default: 'info'
      environment:
        description: 'GitHub Actions environment to run in'
        type: string
        default: production
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  push:
    branches: [main]
  schedule:
    - cron: '0 7,19 * * *'
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Log level'
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - trace

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose Renovate env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f mise.toml ]; then
            # Run Renovate's tools at the versions CI installs from mise.toml, so
            # the lockfiles it writes resolve the way CI does. Without a
            # constraint Renovate picks its own: a newer mise skips git:: task
            # includes, and requires-python alone can land on a Python that the
            # locked dependencies do not build for.
            constraints=$(python3 - <<'PY'
          import json, tomllib
          d = tomllib.load(open("mise.toml", "rb"))
          tools = d.get("tools", {})
          c = {}
          for name, key in (("uv", "aqua:astral-sh/uv"), ("python", "python"), ("node", "node")):
              t = tools.get(key, "")
              v = t.get("version", "") if isinstance(t, dict) else t
              if v:
                  c[name] = v
          if d.get("min_version"):
              c["mise"] = d["min_version"]
          print(json.dumps(c, separators=(",", ":")) if c else "")
          PY
            )
            if [ -n "$constraints" ]; then
              printf 'RENOVATE_CONSTRAINTS=%s\n' "$constraints" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf 'RENOVATE_HOST_RULES=[{"matchHost":"dhi.io","hostType":"docker","username":"%s","password":"%s"}]\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write
          permission-statuses: write
          permission-checks: write

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
