name: Renovate

on:
  workflow_call:
    inputs:
      log-level:
        description: 'Log level'
        type: string
        default: 'info'
      environment:
        description: 'GitHub Actions environment to run in'
        type: string
        default: production
    secrets:
      RENOVATE_APP_CLIENT_ID:
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  push:
    branches: [main]
  schedule:
    - cron: '0 7,19 * * *'
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Log level'
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - trace

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    env:
      RENOVATE_CONTAINERBASE_DIR: /tmp/renovate/cache/containerbase
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Renovate tool downloads
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RENOVATE_CONTAINERBASE_DIR }}
          # Restores the newest entry; each entry is named after its contents.
          key: renovate-tools-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: |
            renovate-tools-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Renovate cache permissions
        # The container also writes repos and package caches under the runner-owned parents.
        run: |
          sudo mkdir -p "$RENOVATE_CONTAINERBASE_DIR"
          sudo chown -R 12021:0 /tmp/renovate

      - name: Compose Renovate env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f mise.toml ]; then
            # Run Renovate's tools at the versions CI installs from mise.toml, so
            # the lockfiles it writes resolve the way CI does. Without a
            # constraint Renovate picks its own: a newer mise skips git:: task
            # includes, and requires-python alone can land on a Python that the
            # locked dependencies do not build for.
            constraints=$(python3 - <<'PY'
          import json, tomllib
          d = tomllib.load(open("mise.toml", "rb"))
          tools = d.get("tools", {})
          c = {}
          for name, key in (("uv", "aqua:astral-sh/uv"), ("python", "python"), ("node", "node")):
              t = tools.get(key, "")
              v = t.get("version", "") if isinstance(t, dict) else t
              if v:
                  c[name] = v
          if d.get("min_version"):
              c["mise"] = d["min_version"]
          print(json.dumps(c, separators=(",", ":")) if c else "")
          PY
            )
            if [ -n "$constraints" ]; then
              printf 'RENOVATE_CONSTRAINTS=%s\n' "$constraints" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf 'RENOVATE_HOST_RULES=[{"matchHost":"dhi.io","hostType":"docker","username":"%s","password":"%s"}]\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write
          permission-statuses: write
          permission-checks: write

      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@7b402fe76b7bc4273576663a09be2f0f85266e2f # v47.0.0
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The shared preset refreshes task tool locks after git:: ref updates.
          RENOVATE_ALLOWED_COMMANDS: '["^mise trust mise\\.toml$", "^mise lock$"]'
          # Lock provenance lookups need authenticated access, not the App write token.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GITHUB_TOKEN":"${{ github.token }}"}'

      - name: Name Renovate tool downloads
        id: tool-key
        if: ${{ !cancelled() && (steps.renovate.outcome == 'success' || steps.renovate.outcome == 'failure') }}
        # A cache entry cannot be overwritten, so each one is named after the
        # files it holds: a run that downloaded nothing new names the entry it
        # restored and saves nothing, instead of adding a copy that only
        # pushes the repository's other caches out.
        run: |
          set -euo pipefail
          digest=$(sudo find "$RENOVATE_CONTAINERBASE_DIR" -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)
          printf 'key=renovate-tools-v1-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$digest" >> "$GITHUB_OUTPUT"

      - name: Save Renovate tool downloads
        # Keep downloads from failed runs so the next retry can reuse them.
        if: ${{ steps.tool-key.outputs.key && steps.tool-key.outputs.key != steps.tool-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RENOVATE_CONTAINERBASE_DIR }}
          key: ${{ steps.tool-key.outputs.key }}
